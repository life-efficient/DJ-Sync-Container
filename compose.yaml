services:
  dj-sync-cron:
    build:
      context: .
      args:
        DJ_SYNC_VERSION: ${DJ_SYNC_VERSION:-0.2.0}
    image: dj-sync-cron:latest
    container_name: dj-sync-cron
    restart: unless-stopped
    environment:
      CRON_SCHEDULE: ${CRON_SCHEDULE:-17 3 * * *}
      DJ_SYNC_VERSION: ${DJ_SYNC_VERSION:-0.2.0}
      SYNC_LIMIT: ${SYNC_LIMIT:-200}
      INCLUDE_BORDERLINE: ${INCLUDE_BORDERLINE:-false}
      RUN_ON_START: ${RUN_ON_START:-false}
    volumes:
      - ${DJ_SYNC_SOURCE_DIR:-../ytm-dropbox-dj-sync}/.env:/runtime/.env:ro
      - ${DJ_SYNC_SOURCE_DIR:-../ytm-dropbox-dj-sync}/.secrets:/runtime/.secrets
      - ${DJ_SYNC_SOURCE_DIR:-../ytm-dropbox-dj-sync}/.data:/runtime/.data
      - ${DJ_SYNC_SOURCE_DIR:-../ytm-dropbox-dj-sync}/library:/runtime/library
      - ./logs:/var/log/dj-sync
